version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahabat_app
    restart: unless-stopped
    volumes:
      - shared_public:/var/www/html/public_shared
      - env_data:/var/www/html/env_data
      - app_storage:/var/www/html/storage
    networks:
      - sahabat-network
    depends_on:
      - db

  web:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: sahabat_web
    restart: unless-stopped
    ports:
      - "8209:80"
    volumes:
      - shared_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    networks:
      - sahabat-network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: sahabat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sahabat_sekolah}
      POSTGRES_USER: ${DB_USERNAME:-sahabat_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1q2w3e4r5tzaq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sahabat-network
    # Port tidak diexpose ke host (internal only)
    # ports:
    #   - "5432:5432"

networks:
  sahabat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.169.91.0/24

volumes:
  pgdata:
  shared_public:
  env_data:
  app_storage:

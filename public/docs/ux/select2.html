<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select2 dengan Tailwind CSS & Vanilla JS | UX Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        /* Custom scrollbar untuk dropdown */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-10 text-slate-800">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold mb-2">Tailwind Select Component</h1>
        <p class="text-slate-500 text-sm mb-8">Alternatif Select2 yang dibangun murni menggunakan Vanilla JavaScript dan Tailwind CSS. Komponen ini mendukung pencarian dan *keyboard navigation*.</p>

        <form action="#" method="POST" class="space-y-6">
            
            <!-- KOMPONEN SELECT2 TAILWIND -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-2">Pilih Sekolah <span class="text-red-500">*</span></label>
                
                <div class="tw-select-container relative w-full" data-name="school_id">
                    <!-- Asli Select (Tersembunyi) untuk pengiriman Form -->
                    <select name="school_id" class="hidden" required>
                        <option value="">-- Pilih Sekolah --</option>
                        <option value="1">SMAN 1 Jakarta</option>
                        <option value="2">SMAN 2 Jakarta</option>
                        <option value="3">SMAN 3 Bandung</option>
                        <option value="4">SMKN 1 Surabaya</option>
                        <option value="5">SMKN 4 Malang</option>
                        <option value="6">SMA Taruna Nusantara</option>
                        <option value="7">MAN 2 Kudus</option>
                        <option value="8">SMA Kristen BPK Penabur</option>
                        <option value="9">SMA Al Azhar 1 Kebayoran Baru</option>
                    </select>

                    <!-- Trigger Button UI -->
                    <button type="button" class="tw-select-trigger w-full flex items-center justify-between bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors">
                        <span class="tw-select-text text-slate-500 truncate">Pilih Sekolah...</span>
                        <svg class="w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>

                    <!-- Dropdown Menu -->
                    <div class="tw-select-dropdown absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg hidden opacity-0 transition-opacity duration-200">
                        <!-- Search Box -->
                        <div class="p-2 border-b border-slate-100">
                            <div class="relative">
                                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <input type="text" class="tw-select-search w-full bg-slate-50 border-none text-sm rounded-md pl-9 pr-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="Cari sekolah...">
                            </div>
                        </div>
                        <!-- Options List -->
                        <ul class="tw-select-list max-h-60 overflow-y-auto custom-scrollbar p-1" role="listbox">
                            <!-- Options akan di-render di sini oleh JS -->
                        </ul>
                        <!-- No Results -->
                        <div class="tw-select-empty hidden p-4 text-center text-sm text-slate-500">
                            Pencarian tidak ditemukan.
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-2">Role Pengguna <span class="text-red-500">*</span></label>
                <div class="tw-select-container relative w-full" data-name="role">
                    <select name="role" class="hidden" required>
                        <option value="">-- Pilih Role --</option>
                        <option value="ADMIN">Administrator</option>
                        <option value="PRINCIPAL">Kepala Sekolah</option>
                        <option value="COUNSELOR">Guru BK</option>
                    </select>
                    <button type="button" class="tw-select-trigger w-full flex items-center justify-between bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors">
                        <span class="tw-select-text text-slate-500 truncate">Pilih Role...</span>
                        <svg class="w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="tw-select-dropdown absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg hidden opacity-0 transition-opacity duration-200">
                        <div class="p-2 border-b border-slate-100">
                            <div class="relative">
                                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                <input type="text" class="tw-select-search w-full bg-slate-50 border-none text-sm rounded-md pl-9 pr-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="Cari role...">
                            </div>
                        </div>
                        <ul class="tw-select-list max-h-60 overflow-y-auto custom-scrollbar p-1" role="listbox"></ul>
                        <div class="tw-select-empty hidden p-4 text-center text-sm text-slate-500">Pencarian tidak ditemukan.</div>
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="bg-blue-600 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow-md hover:bg-blue-700 transition-colors">Simpan Data</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectContainers = document.querySelectorAll('.tw-select-container');

            selectContainers.forEach(container => {
                const nativeSelect = container.querySelector('select');
                const trigger = container.querySelector('.tw-select-trigger');
                const triggerText = container.querySelector('.tw-select-text');
                const dropdown = container.querySelector('.tw-select-dropdown');
                const searchInput = container.querySelector('.tw-select-search');
                const list = container.querySelector('.tw-select-list');
                const emptyState = container.querySelector('.tw-select-empty');

                let isOpen = false;
                let options = [];

                // 1. Ekstrak Opsi dari Select Asli
                Array.from(nativeSelect.options).forEach(opt => {
                    if (opt.value) { // Lewati opsi placeholder kosong
                        options.push({ value: opt.value, text: opt.text, selected: opt.selected });
                    }
                });

                // Set initial text jika ada yang terpilih
                const selectedOpt = options.find(o => o.selected);
                if (selectedOpt) {
                    triggerText.textContent = selectedOpt.text;
                    triggerText.classList.remove('text-slate-500');
                    triggerText.classList.add('text-slate-800');
                }

                // 2. Fungsi Render List
                function renderList(filter = '') {
                    list.innerHTML = '';
                    const filtered = options.filter(opt => opt.text.toLowerCase().includes(filter.toLowerCase()));
                    
                    if (filtered.length === 0) {
                        list.classList.add('hidden');
                        emptyState.classList.remove('hidden');
                    } else {
                        list.classList.remove('hidden');
                        emptyState.classList.add('hidden');
                        
                        filtered.forEach((opt, index) => {
                            const li = document.createElement('li');
                            li.className = `px-3 py-2 text-sm rounded-md cursor-pointer transition-colors flex items-center justify-between ${opt.value === nativeSelect.value ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-100'}`;
                            li.innerHTML = `
                                <span>${opt.text}</span>
                                ${opt.value === nativeSelect.value ? '<svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            `;
                            
                            // Event Click untuk memilih
                            li.addEventListener('click', (e) => {
                                e.stopPropagation();
                                selectOption(opt);
                            });
                            
                            list.appendChild(li);
                        });
                    }
                }

                // 3. Fungsi Memilih Opsi
                function selectOption(opt) {
                    nativeSelect.value = opt.value;
                    nativeSelect.dispatchEvent(new Event('change')); // Trigger event asli
                    
                    triggerText.textContent = opt.text;
                    triggerText.classList.remove('text-slate-500');
                    triggerText.classList.add('text-slate-800');
                    
                    closeDropdown();
                }

                // 4. Toggle Dropdown
                function openDropdown() {
                    isOpen = true;
                    dropdown.classList.remove('hidden');
                    // Timeout kecil untuk animasi transisi opacity
                    setTimeout(() => {
                        dropdown.classList.remove('opacity-0');
                        dropdown.classList.add('opacity-100');
                    }, 10);
                    
                    trigger.classList.add('ring-2', 'ring-blue-500/20', 'border-blue-500');
                    searchInput.value = '';
                    renderList();
                    searchInput.focus();
                }

                function closeDropdown() {
                    isOpen = false;
                    dropdown.classList.remove('opacity-100');
                    dropdown.classList.add('opacity-0');
                    setTimeout(() => {
                        dropdown.classList.add('hidden');
                    }, 200); // Sesuai dengan durasi transisi
                    
                    trigger.classList.remove('ring-2', 'ring-blue-500/20', 'border-blue-500');
                }

                trigger.addEventListener('click', () => {
                    if (isOpen) closeDropdown();
                    else openDropdown();
                });

                // 5. Pencarian
                searchInput.addEventListener('input', (e) => {
                    renderList(e.target.value);
                });

                // 6. Klik di luar untuk menutup
                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target) && isOpen) {
                        closeDropdown();
                    }
                });

                // Render awal (tersembunyi)
                renderList();
            });
        });
    </script>
</body>
</html>
